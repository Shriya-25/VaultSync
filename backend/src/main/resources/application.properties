# ==============================================================================
# VaultSync Coordinator — Application Configuration
# ==============================================================================

server.port=${SERVER_PORT:8080}
spring.application.name=vaultsync-backend

# ------------------------------------------------------------------------------
# PostgreSQL Database Connection
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vaultsync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Multipart Upload Settings (25MB per PRD)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# VaultSync Custom Settings
# ------------------------------------------------------------------------------
vaultsync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Phase 6: Heartbeat, Failure Detection, and Recovery Settings
vaultsync.heartbeat.monitor-interval-ms=${HEARTBEAT_MONITOR_INTERVAL_MS:5000}
vaultsync.heartbeat.timeout-seconds=${HEARTBEAT_TIMEOUT_SECONDS:10}
node.heartbeat.interval-ms=${NODE_HEARTBEAT_INTERVAL_MS:5000}
coordinator.url=${COORDINATOR_URL:http://localhost:8080}
